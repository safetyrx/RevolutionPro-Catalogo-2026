name: Build Revolution Pro Catalogo 2026

on:
  workflow_dispatch:

jobs:

  windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install

      - name: Generar instalador Windows
        run: npx electron-builder --win --x64 --publish never

      - name: Guardar instalador Windows
        uses: actions/upload-artifact@v4
        with:
          name: Revolution-Pro-Windows
          path: dist/*Setup.exe


  macos:
    name: Build macOS
    runs-on: macos-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install

      - name: Generar aplicación macOS Universal
        run: npx electron-builder --mac --universal --publish never

      - name: Guardar instaladores macOS
        uses: actions/upload-artifact@v4
        with:
          name: Revolution-Pro-macOS
          path: |
            dist/*.dmg
            dist/*.zip
